# Secret scanning workflow — runs on every push/PR and nightly.
#
# REQUIRED SETUP: After merging this file, go to:
#   GitHub → Settings → Branches → main → Branch protection rules
#   → "Require status checks to pass before merging"
#   → Add "block-deploy" as a required check
#
# This ensures Vercel (or any deployment integration watching "main") cannot
# proceed until all four jobs below have passed.

name: Secret Scan

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 02:00 UTC — catches anything that slipped through
    - cron: "0 2 * * *"

jobs:
  # ── Job 1: gitleaks — full git history scan ──────────────────────────────────
  gitleaks:
    name: Gitleaks — git history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for the Gitleaks Pro version.
          # If you are on the free tier, delete the line below — the action
          # works without it and will simply skip Pro-only features.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Job 2: trufflehog — entropy + verified credential scan ───────────────────
  trufflehog:
    name: TruffleHog — entropy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for high-entropy strings and verified credentials
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Job 3: dotenv-check — ensure .env files are never committed ───────────────
  dotenv-check:
    name: Dotenv check — no committed env files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed .env files
        run: |
          # Fail if any .env variant is tracked by git
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "FAIL: .env file is committed to the repository"
            exit 1
          fi
          echo "OK: no bare .env files committed"

      - name: Check for committed secret file patterns
        run: |
          FAIL=0

          # Check for .env.* variants (e.g. .env.local, .env.production, .env.development)
          if git ls-files | grep -E '(^|/)\.env\..+'; then
            echo "FAIL: .env.* file committed"
            FAIL=1
          fi

          # Check for PEM certificates and bare key files outside node_modules / .git
          if git ls-files | grep -vE '^(node_modules|\.git)/' | grep -E '\.(pem|key)$'; then
            echo "FAIL: .pem or .key file committed"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

          echo "OK: no secret file patterns found"

  # ── Job 4: block-deploy — deployment gate ────────────────────────────────────
  block-deploy:
    name: block-deploy
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, dotenv-check]
    # Only gate deployments on pushes to main; PRs get the signal from the
    # upstream jobs directly via required status checks.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: All security checks passed
        run: echo "Security checks passed — safe to deploy"
